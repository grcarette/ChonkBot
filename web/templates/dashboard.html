<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Control — Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-top">
        <div class="tournament-title" style="font-size:16px;font-weight:800;color:var(--accent)">ChonkBot</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:3px;letter-spacing:.06em;text-transform:uppercase">Control Panel</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-label">Overview</div>
        <button class="nav-item active" data-section="overview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
        </button>
    </nav>
    <div class="sidebar-footer">
        <div class="user-row">
            <div id="user-avatar-wrap"></div>
            <span class="user-name">__USERNAME__</span>
            <a href="/auth/logout" class="logout-btn" title="Sign out">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </a>
        </div>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div>
            <div class="page-title" id="topbar-title">Dashboard</div>
            <div class="page-subtitle" id="topbar-sub">Overview of active tournaments</div>
        </div>
    </div>
    <div class="content">
        <div class="section active" id="section-overview">
            <div class="section-header">
                <div class="section-title">Tournaments</div>
                <button class="btn-create" id="btn-create-event">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Create Event
                </button>
            </div>
            <div id="tournament-list-wrap">
                <div class="loading-row"><div class="spinner"></div>Loading tournaments…</div>
            </div>
        </div>
    </div>
</main>

<!-- Create Event modal -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" style="max-width:480px;max-height:calc(100vh - 32px);overflow-y:auto;" role="dialog" aria-modal="true">
        <div class="modal-header" style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0">
            <h2 style="font-size:16px;font-weight:700;margin:0" id="modal-title">Create Event</h2>
            <button class="drawer-close" id="modal-close" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">

            <!-- Step 1: name, date, format -->
            <div id="step-1">
                <div class="field-group">
                    <label class="field-label" for="field-name">Tournament Name <span class="req">*</span></label>
                    <input class="field-input" type="text" id="field-name" placeholder="e.g. UCH Monthly #12" maxlength="80" autocomplete="off">
                </div>
                <div class="field-group">
                    <label class="field-label" for="field-date">Date <span class="field-hint">(optional)</span></label>
                    <input class="field-input" type="text" id="field-date" placeholder="e.g. Saturday 7th June, 7pm BST">
                </div>
                <div class="field-group">
                    <label class="field-label">Format <span class="req">*</span></label>
                    <div class="format-grid">
                        <button class="format-btn" data-value="single elimination">Single Elim</button>
                        <button class="format-btn" data-value="double elimination">Double Elim</button>
                        <button class="format-btn" data-value="swiss">Swiss</button>
                        <button class="format-btn" data-value="swiss filter">Swiss Filter</button>
                    </div>
                </div>
            </div>

            <!-- Step 2: configuration (hidden until format chosen) -->
            <div id="step-2" hidden>
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px;padding:10px 12px;background:var(--bg-main);border-radius:6px;border:1px solid var(--border)">
                    <span id="step2-summary"></span>
                </div>

                <!-- Round limit — only shown for swiss -->
                <div class="field-group" id="round-limit-group" hidden>
                    <label class="field-label" for="field-rounds">Round Limit</label>
                    <input class="field-input" type="number" id="field-rounds" min="1" max="99" value="8" style="width:80px">
                </div>

                <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden">
                    <label class="toggle-row">
                        <span class="toggle-info"><span class="toggle-name">Approved Registration</span><span class="toggle-desc">Registrations require TO approval</span></span>
                        <span class="toggle-wrap"><input type="checkbox" id="opt-approved" class="toggle-input"><span class="toggle-thumb"></span></span>
                    </label>
                    <label class="toggle-row">
                        <span class="toggle-info"><span class="toggle-name">Randomised Stagelist</span><span class="toggle-desc">Stage order shuffled each match</span></span>
                        <span class="toggle-wrap"><input type="checkbox" id="opt-random-stage" class="toggle-input"><span class="toggle-thumb"></span></span>
                    </label>
                    <label class="toggle-row">
                        <span class="toggle-info"><span class="toggle-name">Display Entrants</span><span class="toggle-desc">Show registered players on event info embed</span></span>
                        <span class="toggle-wrap"><input type="checkbox" id="opt-display-entrants" class="toggle-input"><span class="toggle-thumb"></span></span>
                    </label>
                    <label class="toggle-row" style="border-bottom:none">
                        <span class="toggle-info"><span class="toggle-name">Debug Event</span><span class="toggle-desc">Hidden test tournament with fake players</span></span>
                        <span class="toggle-wrap"><input type="checkbox" id="opt-debug" class="toggle-input"><span class="toggle-thumb"></span></span>
                    </label>
                </div>
            </div>

        </div>
        <div style="padding:0 24px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <button class="btn-secondary" id="modal-cancel">Cancel</button>
            <div style="display:flex;gap:10px;align-items:center">
                <div class="modal-error" id="modal-error" hidden></div>
                <button class="btn-create" id="modal-back" hidden>Back</button>
                <button class="btn-create" id="modal-submit">
                    <span class="btn-label">Continue</span>
                    <span class="btn-spinner" hidden>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const USERNAME  = '__USERNAME__';
    const AVATAR_URL = '__AVATAR_URL__';
</script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
