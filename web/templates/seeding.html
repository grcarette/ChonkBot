<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Seeding</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 32px 16px;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        #status-bar {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 28px;
            min-height: 20px;
        }

        #status-bar.saving { color: #f0a500; }
        #status-bar.saved  { color: #4caf50; }
        #status-bar.error  { color: #f44336; }

        #player-list {
            list-style: none;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            cursor: grab;
            user-select: none;
            /* All items animate their position smoothly */
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .player-item:active {
            cursor: grabbing;
        }

        /* The item being dragged floats above everything */
        .player-item.is-dragging {
            opacity: 0;
            pointer-events: none;
            transition: none;
        }

        /* The floating ghost that follows the cursor */
        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.92;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border-radius: 8px;
            background: #1e2f5e;
            border: 1px solid #5b8dee;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 480px;
            width: var(--ghost-width);
            transform: scale(1.03);
            transition: box-shadow 0.15s ease;
        }

        /* Items shift up or down to make room */
        .player-item.shift-down {
            transform: translateY(calc(var(--item-height) + 8px));
        }

        .player-item.shift-up {
            transform: translateY(calc(-1 * (var(--item-height) + 8px)));
        }

        .seed-number {
            font-size: 1rem;
            font-weight: 700;
            color: #5b8dee;
            min-width: 28px;
            text-align: right;
        }

        .player-name {
            font-size: 1rem;
            flex: 1;
        }

        .drag-handle {
            color: #444;
            font-size: 1.1rem;
            cursor: grab;
        }

        #loading {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1rem;
        }

        #error-message {
            text-align: center;
            padding: 40px;
            color: #f44336;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Tournament Seeding</h1>
    <div id="status-bar">Loading participants...</div>

    <div id="loading">Fetching players from Challonge...</div>
    <div id="error-message"></div>
    <ul id="player-list"></ul>

    <script>
        const TOKEN = '__TOKEN__';
        const statusBar = document.getElementById('status-bar');
        const playerList = document.getElementById('player-list');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');

        let players = [];
        let dragState = null; // holds all drag context while a drag is active

        // ─── Fetch ────────────────────────────────────────────────────────────

        async function fetchParticipants() {
            try {
                const res = await fetch(`/api/participants?token=${TOKEN}`);
                if (!res.ok) throw new Error(await res.text());
                players = await res.json();
                loading.style.display = 'none';
                renderList();
                setStatus('');
            } catch (err) {
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = `Failed to load participants: ${err.message}`;
            }
        }

        // ─── Render ───────────────────────────────────────────────────────────

        function renderList() {
            playerList.innerHTML = '';
            players.forEach((player, index) => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.dataset.index = index;

                li.innerHTML = `
                    <span class="drag-handle">⠿</span>
                    <span class="seed-number">${index + 1}</span>
                    <span class="player-name">${escapeHtml(player.name)}</span>
                `;

                li.addEventListener('pointerdown', onPointerDown);
                playerList.appendChild(li);
            });

            // Set the CSS variable for item height based on the first item
            requestAnimationFrame(() => {
                const firstItem = playerList.querySelector('.player-item');
                if (firstItem) {
                    playerList.style.setProperty('--item-height', `${firstItem.offsetHeight}px`);
                }
            });
        }

        // ─── Pointer down — start drag ────────────────────────────────────────

        function onPointerDown(e) {
            if (e.button !== 0) return; // left click only
            e.preventDefault();

            const item = e.currentTarget;
            const srcIndex = parseInt(item.dataset.index);
            const rect = item.getBoundingClientRect();

            // Create the ghost element that follows the cursor
            const ghost = item.cloneNode(true);
            ghost.id = 'drag-ghost';
            ghost.style.setProperty('--ghost-width', `${rect.width}px`);
            ghost.style.top = `${rect.top}px`;
            ghost.style.left = `${rect.left}px`;
            document.body.appendChild(ghost);

            // Hide the original item in place
            item.classList.add('is-dragging');

            dragState = {
                srcIndex,
                currentIndex: srcIndex, // tracks the live insertion position
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top,
                ghost,
                item,
            };

            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
        }

        // ─── Pointer move — update ghost + shift items ────────────────────────

        function onPointerMove(e) {
            if (!dragState) return;

            const { ghost, offsetX, offsetY, srcIndex } = dragState;

            // Move the ghost to follow cursor
            ghost.style.left = `${e.clientX - offsetX}px`;
            ghost.style.top = `${e.clientY - offsetY}px`;

            // Find which index the cursor is hovering over
            const items = [...playerList.querySelectorAll('.player-item:not(.is-dragging)')];
            let newIndex = srcIndex;

            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();
                const midY = rect.top + rect.height / 2;

                // Map back to original index (skip the dragging item)
                const itemOriginalIndex = parseInt(items[i].dataset.index);

                if (e.clientY > midY) {
                    // Cursor is below this item's midpoint — insertion is after it
                    newIndex = itemOriginalIndex >= srcIndex
                        ? itemOriginalIndex
                        : itemOriginalIndex + 1;
                }
            }

            // Clamp to valid range
            newIndex = Math.max(0, Math.min(newIndex, players.length - 1));

            if (newIndex !== dragState.currentIndex) {
                dragState.currentIndex = newIndex;
                applyShifts(srcIndex, newIndex);
            }
        }

        // ─── Apply transforms to items to animate them out of the way ─────────

        function applyShifts(srcIndex, targetIndex) {
            const allItems = [...playerList.querySelectorAll('.player-item')];

            allItems.forEach(item => {
                const idx = parseInt(item.dataset.index);
                if (idx === srcIndex) return; // skip the dragged item itself

                item.classList.remove('shift-up', 'shift-down');

                if (srcIndex < targetIndex) {
                    // Dragging downward — items between src and target shift up
                    if (idx > srcIndex && idx <= targetIndex) {
                        item.classList.add('shift-up');
                    }
                } else if (srcIndex > targetIndex) {
                    // Dragging upward — items between target and src shift down
                    if (idx >= targetIndex && idx < srcIndex) {
                        item.classList.add('shift-down');
                    }
                }
            });
        }

        // ─── Pointer up — commit the drop ────────────────────────────────────

        async function onPointerUp() {
            if (!dragState) return;

            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);

            const { srcIndex, currentIndex, ghost, item } = dragState;
            dragState = null;

            // Clean up ghost and shifts
            ghost.remove();
            item.classList.remove('is-dragging');
            playerList.querySelectorAll('.player-item').forEach(el => {
                el.classList.remove('shift-up', 'shift-down');
            });

            if (srcIndex !== currentIndex) {
                const moved = players.splice(srcIndex, 1)[0];
                players.splice(currentIndex, 0, moved);
                renderList();
                await syncAllSeeds();
            }
        }

        // ─── Sync seeds ───────────────────────────────────────────────────────

        async function syncAllSeeds() {
            setStatus('Saving...', 'saving');
            try {
                for (let i = 0; i < players.length; i++) {
                    const res = await fetch(`/api/seed?token=${TOKEN}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            participant_id: players[i].id,
                            seed: i + 1
                        })
                    });
                    if (!res.ok) throw new Error(`Failed to update seed for ${players[i].name}`);
                }
                setStatus('Saved ✓', 'saved');
                setTimeout(() => setStatus(''), 2500);
            } catch (err) {
                setStatus(`Error saving: ${err.message}`, 'error');
            }
        }

        // ─── Helpers ─────────────────────────────────────────────────────────

        function setStatus(message, type = '') {
            statusBar.textContent = message;
            statusBar.className = type;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        fetchParticipants();
    </script>
</body>
</html>
